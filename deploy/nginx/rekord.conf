# Rekord Match — DJ tool + wedding-guest magic links.
#
# The app has its own login (admin + per-DJ accounts, cookie sessions), so
# nginx only terminates TLS and forwards. Every DJ route answers 401 by
# itself; guest routes carry their magic-link token as their own auth.
server {
    listen 80;
    listen [::]:80;
    server_name rekord.viktorvansteenweghen.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name rekord.viktorvansteenweghen.com;

    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;

    # rekordbox XML imports are capped at 256MB server-side (MAX_XML_BYTES).
    client_max_body_size 300m;

    # Inherited by every location below that doesn't override them.
    # X-Forwarded-Proto is load-bearing: the app marks its session cookie
    # Secure only when it sees https here.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A magic link is a secret in the URL, so the guest page must not leak its
    # own URL onward in a Referer header.
    location ^~ /g/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
